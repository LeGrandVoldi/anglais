<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprentissage Anglais ↔ Français</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 5px;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            margin-bottom: 20px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 15px;
            font-weight: 600;
            font-size: clamp(1rem, 3vw, 1.2rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-body {
            padding: 15px;
        }

        .phrase-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .phrase-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .btn-custom {
            border-radius: 25px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-custom:hover {
            transform: scale(1.05);
        }

        .btn-sm {
            padding: 6px 12px !important;
            font-size: 0.8rem !important;
        }

        .listening-mode {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .phrase-display {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            word-break: break-word;
        }

        .progress-indicator {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-text {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: clamp(2rem, 8vw, 3rem);
        }

        .delete-btn {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .phrase-item:hover .delete-btn {
            opacity: 1;
        }

        .hidden-phrase {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            padding: 12px;
            border-radius: 10px;
        }

        .hidden-phrase-text {
            font-style: italic;
            opacity: 0.8;
            font-size: 0.9rem;
            flex: 1;
            min-width: 140px;
        }

        .hidden-phrase > div {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .visible-phrase {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .visible-phrase > div:first-child {
            flex: 1;
        }

        .visible-phrase-text {
            word-break: break-word;
        }

        .button-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .listening-controls-wrapper {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        @media (max-width: 576px) {
            body {
                padding: 10px;
            }

            .main-container {
                padding: 0;
            }

            .card {
                margin-bottom: 15px;
            }

            .card-header {
                padding: 12px;
                font-size: 1rem;
            }

            .card-body {
                padding: 12px;
            }

            .phrase-item {
                padding: 10px;
            }

            h1 {
                font-size: 1.3rem;
                margin-bottom: 15px;
            }

            .btn-custom {
                padding: 6px 12px;
                font-size: 0.85rem;
            }

            .listening-mode {
                padding: 15px;
                min-height: 250px;
            }

            .phrase-display {
                padding: 15px;
            }

            .delete-btn {
                opacity: 1;
            }

            .hidden-phrase {
                padding: 10px;
            }

            .hidden-phrase-text {
                font-size: 0.85rem;
            }

            .button-group {
                width: 100%;
                justify-content: space-between;
                gap: 4px;
            }

            .listening-controls-wrapper {
                gap: 6px;
            }

            .listening-controls-wrapper button {
                flex: 1;
                min-width: 70px;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 1.1rem;
            }

            .card-header {
                padding: 10px;
                font-size: 0.9rem;
            }

            .btn-custom {
                padding: 5px 10px;
                font-size: 0.75rem;
            }

            .btn-sm {
                padding: 4px 8px !important;
                font-size: 0.7rem !important;
            }

            .listening-controls-wrapper button {
                font-size: 0.75rem;
                padding: 8px 10px !important;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="text-center mb-4">
            <h1 class="text-white fw-bold">
                <i class="bi bi-translate"></i> Apprentissage Anglais ↔ Français
            </h1>
        </div>

        <!-- Section Ajout de phrases -->
        <div class="card fade-in">
            <div class="card-header">
                <i class="bi bi-plus-circle"></i> <span>Ajouter une phrase</span>
            </div>
            <div class="card-body">
                <form id="addPhraseForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-flag-fill text-primary"></i> Phrase en anglais
                        </label>
                        <input type="text" class="form-control" id="englishPhrase" placeholder="Hello, how are you?" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-flag-fill text-danger"></i> Traduction en français
                        </label>
                        <input type="text" class="form-control" id="frenchPhrase" placeholder="Bonjour, comment allez-vous ?" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-custom w-100">
                        <i class="bi bi-save"></i> Enregistrer
                    </button>
                </form>
            </div>
        </div>

        <!-- Section Liste des phrases -->
        <div class="card fade-in">
            <div class="card-header">
                <span><i class="bi bi-list-ul"></i> Mes phrases (<span id="phraseCount">0</span>)</span>
                <div class="button-group">
                    <button class="btn btn-success btn-sm btn-custom" id="listenModeBtn" disabled>
                        <i class="bi bi-headphones"></i> <span class="d-none d-sm-inline">Mode Écoute</span><span class="d-sm-none">Écoute</span>
                    </button>
                    <button class="btn btn-danger btn-sm btn-custom" id="clearAllBtn">
                        <i class="bi bi-trash"></i> <span class="d-none d-sm-inline">Tout supprimer</span><span class="d-sm-none">Supprimer</span>
                    </button>
                </div>
            </div>
            <div class="card-body" id="phrasesList">
                <div class="empty-state">
                    <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                    <p class="mt-3">Aucune phrase enregistrée. Ajoutez votre première phrase ci-dessus !</p>
                </div>
            </div>
        </div>

        <!-- Section Mode Écoute -->
        <div class="card fade-in" id="listeningModeCard" style="display: none;">
            <div class="card-body p-0">
                <div class="listening-mode">
                    <div class="progress-indicator" id="progressIndicator"></div>

                    <div id="listeningContent">
                        <div class="loading-text">
                            <i class="bi bi-volume-up-fill"></i> 👉 Expression en cours...
                        </div>
                    </div>

                    <div id="phraseDisplayArea" style="display: none;"></div>

                    <div class="listening-controls-wrapper" id="listeningControls">
                        <button class="btn btn-light btn-custom" id="showBtn">
                            <i class="bi bi-eye"></i> <span class="d-none d-sm-inline">Afficher</span>
                        </button>
                        <button class="btn btn-outline-light btn-custom" id="replayBtn">
                            <i class="bi bi-arrow-clockwise"></i> <span class="d-none d-sm-inline">Réécouter</span>
                        </button>
                        <button class="btn btn-warning btn-custom" id="nextBtn">
                            <i class="bi bi-skip-forward"></i> <span class="d-none d-sm-inline">Suivant</span>
                        </button>
                        <button class="btn btn-danger btn-custom" id="exitListenBtn">
                            <i class="bi bi-x-circle"></i> <span class="d-none d-sm-inline">Quitter</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const STORAGE_KEY = 'language_phrases';
        let phrases = [];
        let listeningMode = {
            active: false,
            currentIndex: -1,
            remainingPhrases: [],
            currentPhrase: null,
            isRevealed: false
        };

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', () => {
            loadPhrases();
            renderPhrases();
            setupEventListeners();
        });

        // Configuration des événements
        function setupEventListeners() {
            document.getElementById('addPhraseForm').addEventListener('submit', addPhrase);
            document.getElementById('clearAllBtn').addEventListener('click', clearAllPhrases);
            document.getElementById('listenModeBtn').addEventListener('click', startListeningMode);
            document.getElementById('showBtn').addEventListener('click', showPhrase);
            document.getElementById('replayBtn').addEventListener('click', replayPhrase);
            document.getElementById('nextBtn').addEventListener('click', nextPhrase);
            document.getElementById('exitListenBtn').addEventListener('click', exitListeningMode);
        }

        // Chargement des phrases depuis localStorage
        function loadPhrases() {
            const stored = localStorage.getItem(STORAGE_KEY);
            phrases = stored ? JSON.parse(stored) : [];
        }

        // Sauvegarde des phrases dans localStorage
        function savePhrases() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(phrases));
        }

        // Ajout d'une nouvelle phrase
        function addPhrase(e) {
            e.preventDefault();

            const englishPhrase = document.getElementById('englishPhrase').value.trim();
            const frenchPhrase = document.getElementById('frenchPhrase').value.trim();

            if (englishPhrase && frenchPhrase) {
                phrases.push({
                    id: Date.now(),
                    english: englishPhrase,
                    french: frenchPhrase
                });

                savePhrases();
                renderPhrases();

                // Réinitialiser le formulaire
                document.getElementById('addPhraseForm').reset();

                // Animation de succès
                showNotification('Phrase ajoutée avec succès !', 'success');
            }
        }

        // Affichage des phrases
        function renderPhrases() {
            const container = document.getElementById('phrasesList');
            const countElement = document.getElementById('phraseCount');
            const listenBtn = document.getElementById('listenModeBtn');

            countElement.textContent = phrases.length;
            listenBtn.disabled = phrases.length === 0;

            if (phrases.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                        <p class="mt-3">Aucune phrase enregistrée. Ajoutez votre première phrase ci-dessus !</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = phrases.map(phrase => `
                <div class="phrase-item fade-in">
                    <div id="phrase-${phrase.id}-hidden" class="hidden-phrase">
                        <span class="hidden-phrase-text"><i class="bi bi-lock-fill"></i> Masquée</span>
                        <div class="button-group" style="min-width: auto;">
                            <button class="btn btn-sm btn-light btn-custom" onclick="togglePhrase(${phrase.id})">
                                <i class="bi bi-eye"></i> <span class="d-none d-sm-inline">Voir</span>
                            </button>
                            <button class="btn btn-sm btn-outline-danger delete-btn" onclick="deletePhrase(${phrase.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div id="phrase-${phrase.id}-visible" style="display: none;" class="visible-phrase">
                        <div class="visible-phrase-text">
                            <div class="mb-2">
                                <strong><i class="bi bi-flag-fill text-primary"></i> EN:</strong><br>
                                <span style="word-break: break-word;">${escapeHtml(phrase.english)}</span>
                            </div>
                            <div>
                                <strong><i class="bi bi-flag-fill text-danger"></i> FR:</strong><br>
                                <span style="word-break: break-word;">${escapeHtml(phrase.french)}</span>
                            </div>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-sm btn-secondary btn-custom" onclick="togglePhrase(${phrase.id})">
                                <i class="bi bi-eye-slash"></i> <span class="d-none d-sm-inline">Masquer</span>
                            </button>
                            <button class="btn btn-sm btn-outline-danger delete-btn" onclick="deletePhrase(${phrase.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Toggle affichage/masquage des phrases
        function togglePhrase(id) {
            const hiddenEl = document.getElementById(`phrase-${id}-hidden`);
            const visibleEl = document.getElementById(`phrase-${id}-visible`);

            if (hiddenEl.style.display === 'none') {
                hiddenEl.style.display = 'flex';
                visibleEl.style.display = 'none';
            } else {
                hiddenEl.style.display = 'none';
                visibleEl.style.display = 'block';
            }
        }

        // Suppression d'une phrase
        function deletePhrase(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette phrase ?')) {
                phrases = phrases.filter(p => p.id !== id);
                savePhrases();
                renderPhrases();
                showNotification('Phrase supprimée', 'info');
            }
        }

        // Suppression de toutes les phrases
        function clearAllPhrases() {
            if (phrases.length === 0) return;

            if (confirm('Êtes-vous sûr de vouloir supprimer TOUTES les phrases ?')) {
                phrases = [];
                savePhrases();
                renderPhrases();
                showNotification('Toutes les phrases ont été supprimées', 'warning');
            }
        }

        // Démarrage du mode écoute
        function startListeningMode() {
            if (phrases.length === 0) return;

            listeningMode.active = true;
            listeningMode.remainingPhrases = [...phrases];
            listeningMode.isRevealed = false;

            // Mélanger les phrases
            shuffleArray(listeningMode.remainingPhrases);

            document.getElementById('listeningModeCard').style.display = 'block';
            document.getElementById('listeningModeCard').scrollIntoView({ behavior: 'smooth' });

            playNextPhrase();
        }

        // Jouer la phrase suivante
        function playNextPhrase() {
            if (listeningMode.remainingPhrases.length === 0) {
                showCompletionMessage();
                return;
            }

            listeningMode.currentPhrase = listeningMode.remainingPhrases.shift();
            listeningMode.isRevealed = false;

            updateProgressIndicator();
            hidePhrase();
            speakPhrase(listeningMode.currentPhrase.english);
        }

        // Afficher la phrase
        function showPhrase() {
            if (!listeningMode.currentPhrase || listeningMode.isRevealed) return;

            listeningMode.isRevealed = true;
            const displayArea = document.getElementById('phraseDisplayArea');

            displayArea.innerHTML = `
                <div class="phrase-display fade-in">
                    <div class="mb-3">
                        <strong style="font-size: 1.2rem;"><i class="bi bi-flag-fill text-primary"></i> Anglais:</strong>
                        <div style="font-size: 1.4rem; margin-top: 10px;">${escapeHtml(listeningMode.currentPhrase.english)}</div>
                    </div>
                    <hr>
                    <div>
                        <strong style="font-size: 1.2rem;"><i class="bi bi-flag-fill text-danger"></i> Français:</strong>
                        <div style="font-size: 1.4rem; margin-top: 10px;">${escapeHtml(listeningMode.currentPhrase.french)}</div>
                    </div>
                </div>
            `;
            displayArea.style.display = 'block';
        }

        // Masquer la phrase
        function hidePhrase() {
            const displayArea = document.getElementById('phraseDisplayArea');
            displayArea.style.display = 'none';
        }

        // Réécouter la phrase
        function replayPhrase() {
            if (listeningMode.currentPhrase) {
                speakPhrase(listeningMode.currentPhrase.english);
            }
        }

        // Phrase suivante
        function nextPhrase() {
            playNextPhrase();
        }

        // Quitter le mode écoute
        function exitListeningMode() {
            listeningMode.active = false;
            listeningMode.currentPhrase = null;
            listeningMode.remainingPhrases = [];
            document.getElementById('listeningModeCard').style.display = 'none';
        }

        // Message de fin
        function showCompletionMessage() {
            const total = phrases.length;
            const displayArea = document.getElementById('phraseDisplayArea');
            displayArea.innerHTML = `
                <div class="phrase-display fade-in text-center">
                    <h2>🎉 Félicitations !</h2>
                    <p style="font-size: 1.2rem; margin-top: 20px;">Vous avez écouté les ${total} expressions !</p>
                    <button class="btn btn-success btn-custom mt-3" onclick="startListeningMode()">
                        <i class="bi bi-arrow-clockwise"></i> Recommencer
                    </button>
                    <button class="btn btn-secondary btn-custom mt-3 ms-2" onclick="exitListeningMode()">
                        <i class="bi bi-x-circle"></i> Quitter
                    </button>
                </div>
            `;
            displayArea.style.display = 'block';
            document.getElementById('listeningControls').style.display = 'none';
            document.getElementById('progressIndicator').textContent = `Terminé ! ${total} expressions écoutées 🎉`;
        }

        // Mise à jour de l'indicateur de progression - le total est caché pendant l'écoute
        function updateProgressIndicator() {
            const total = phrases.length;
            const remaining = listeningMode.remainingPhrases.length;
            const current = total - remaining;
            document.getElementById('progressIndicator').textContent = `Phrase ${current} / ?`;
            document.getElementById('listeningControls').style.display = 'block';
        }

        // Lecture audio avec Speech Synthesis
        function speakPhrase(text) {
            if ('speechSynthesis' in window) {
                // Arrêter toute lecture en cours
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1;

                window.speechSynthesis.speak(utterance);
            } else {
                alert('Votre navigateur ne supporte pas la synthèse vocale.');
            }
        }

        // Mélanger un tableau (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Échapper le HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Notification toast
        function showNotification(message, type = 'success') {
            const colors = {
                success: '#38ef7d',
                info: '#667eea',
                warning: '#f7b731',
                danger: '#ee5a6f'
            };

            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${colors[type]};
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 9999;
                animation: slideIn 0.3s ease-out;
            `;
            toast.textContent = message;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Styles d'animation pour les notifications
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(400px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(400px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
